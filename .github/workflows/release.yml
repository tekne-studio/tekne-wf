# Publishes @tekne/wf when a version tag arrives (`bun run release` pushes it).
#
# From a clean checkout of the tag, so what reaches npm.tekne.studio is exactly
# what the tag holds. The checks run again here: a tag pushed by hand, without
# the release script, still cannot publish something that fails them.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# one publish at a time; a second tag waits instead of racing the first
concurrency: release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: The registry token is set
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set: gh secret set NPM_TOKEN -R tekne-studio/tekne-wf"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Bun 1.3.14 reads the user npmrc from $XDG_CONFIG_HOME/.npmrc, which the Ubuntu runner sets; npm reads $HOME/.npmrc
      - run: |
          mkdir -p "${XDG_CONFIG_HOME:-$HOME}"
          for f in "$HOME/.npmrc" "${XDG_CONFIG_HOME:-$HOME}/.npmrc"; do
            echo "//npm.tekne.studio/:_authToken=${NPM_TOKEN}" > "$f"
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: bun install --frozen-lockfile

      - name: The tag is the version in package.json
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"

      - run: bun run check
      - run: bun kb check
      - run: bun run test
      - run: bun wf check

      - name: Publish to npm.tekne.studio
        run: npm publish
