name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Bun 1.3.14 reads the user npmrc from $XDG_CONFIG_HOME/.npmrc, which the Ubuntu runner sets; npm reads $HOME/.npmrc
      - run: |
          mkdir -p "${XDG_CONFIG_HOME:-$HOME}"
          for f in "$HOME/.npmrc" "${XDG_CONFIG_HOME:-$HOME}/.npmrc"; do
            echo "//npm.tekne.studio/:_authToken=${NPM_TOKEN}" > "$f"
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun kb check
      - run: bun run test
      - run: bun wf check
